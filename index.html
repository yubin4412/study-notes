<html lang="ko">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽 목차(진행도) + 오른쪽 학습 노트. 각 주제 = 정리(표) → 질문(답 입력). 정글 탐험 기획 노트 느낌의 이끼색 + 금빛 */
:root{
  --bg:#f2f4ee; --paper:#fbfcf8; --ink:#1d2a22; --muted:#5d6b62; --line:#d6dccf;
  --moss:#2f5d46; --moss-soft:#e1ebe3; --gold:#a8730f; --gold-soft:#f6ecd6;
  --sky:#2b5d8a; --sky-soft:#e1ebf4; --plum:#6a4a86; --plum-soft:#ece4f3;
  --field:#ffffff;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101814; --paper:#16211b; --ink:#e4ebe5; --muted:#9aa89f; --line:#2a3a31;
  --moss:#7fc29b; --moss-soft:#1f3328; --gold:#e3b04f; --gold-soft:#33291a;
  --sky:#8dbbe6; --sky-soft:#1b2a38; --plum:#c3a5e0; --plum-soft:#2a2135; --field:#0f1712; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814; --paper:#16211b; --ink:#e4ebe5; --muted:#9aa89f; --line:#2a3a31;
  --moss:#7fc29b; --moss-soft:#1f3328; --gold:#e3b04f; --gold-soft:#33291a;
  --sky:#8dbbe6; --sky-soft:#1b2a38; --plum:#c3a5e0; --plum-soft:#2a2135; --field:#0f1712; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-title{font-family:var(--f-display);font-size:18px;letter-spacing:.01em;margin-right:auto}
.meter{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-track{width:120px;height:6px;border-radius:3px;background:var(--moss-soft);overflow:hidden}
.meter-fill{height:100%;background:var(--gold);width:0;transition:width .3s}
.save{font-size:12px;color:var(--muted)}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--moss)}
.btn[aria-pressed="true"]{background:var(--moss);color:var(--paper);border-color:var(--moss)}
.btn:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.head{padding-block:40px 28px;display:grid;gap:12px;max-width:780px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.rules,.legend{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.rules li{font-size:13px;background:var(--gold-soft);color:var(--ink);padding:4px 10px;border-radius:4px}
.legend li{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}

.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);display:grid;gap:2px;font-size:14px}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.toc a:hover{background:var(--moss-soft)}
.toc a.hw{color:var(--plum);font-weight:700}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.toc a.full .n{color:var(--moss)}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.toc{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-bottom:8px;border-bottom:1px solid var(--line)}}

.chapter{display:grid;gap:22px;padding-top:16px;scroll-margin-top:72px}
.ch-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.ch-no{font-family:var(--f-mono);font-size:13px;color:var(--gold)}
.ch-head h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.chapter.homework .ch-head{border-color:var(--plum)}
.chapter.homework .ch-no{color:var(--plum)}
.chapters{display:grid;gap:56px}

.topic{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.homework .topic{border-color:var(--plum)}
.t-head{padding:16px 20px 0;display:grid;gap:2px}
.t-row{display:flex;gap:10px;align-items:baseline}
.t-id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.t-head h3{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.t-sub{margin:0;font-size:13px;color:var(--muted)}
.summary{padding:12px 20px 18px;display:grid;gap:10px}
.summary p{margin:0}
.key{border-left:3px solid var(--gold);padding:2px 0 2px 12px;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500;background:var(--bg)}
td:first-child{font-weight:500;white-space:nowrap}

.qs{border-top:1px dashed var(--line);background:var(--bg);padding:14px 20px 18px;display:grid;gap:14px}
.qs:empty{display:none}
.q{display:grid;gap:6px}
.q-top{display:flex;gap:8px;align-items:baseline}
.tag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.02em}
.tag.pdf{background:var(--sky-soft);color:var(--sky)}
.tag.me{background:var(--moss-soft);color:var(--moss)}
.tag.fit{background:var(--gold-soft);color:var(--gold)}
.tag.hw{background:var(--plum-soft);color:var(--plum)}
.q-text{font-weight:500}
.q-hint{font-size:13px;color:var(--muted);margin:0}
.q.done .q-text::after{content:"  ✓";color:var(--moss)}
textarea{width:100%;min-height:64px;resize:vertical;font:15px/1.6 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea.long{min-height:220px}
.q.done textarea{border-color:var(--moss)}
body.only-empty .q.done{display:none}
body.only-empty .topic.all-done{display:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px}
@media (prefers-reduced-motion:reduce){.meter-fill{transition:none}}
.tabs{display:flex;gap:4px;margin-right:auto}
.tab{font:500 14px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer}
.tab:hover{background:var(--moss-soft);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--moss);color:var(--paper)}
.tab[data-view="hw"][aria-selected="true"]{background:var(--plum)}
@media (max-width:600px){.bar{position:static}}
</style>
</head>

 {id:"6-3",title:"제출 전 점검 — 흔한 실수 네 가지",s:[T(["점검","확인"],[["메카닉(동사 한 단어)과 루프(사이클)를 따로 썼다","□"],["재미를 \"그냥 재밌다\"가 아니라 4 Keys · 미학 용어로 설명했다","□"],["타깃을 \"모든 사람\"이 아니라 유형 하나로 고르고 이유를 썼다","□"],["루프를 5단계 이내로 줄였다","□"]]),{k:"다음 회차 · 2회차 규칙과 시스템: 시스템 사고 · 피드백 루프 · 창발성 · 의미 있는 선택"}],

];
const LABEL={pdf:"강의 원문",me:"나의 생각",fit:"아이핏 적용",hw:"숙제"};
FULL.forEach(c=>c.topics.forEach(t=>{let n=0;t.q=t.q.map(q=>{const fixed=q[2];if(!fixed)n++;return{kind:q[0],text:q[1],id:fixed||("q"+t.id+"-"+n),hint:q[3]||""}})}));
// 탭 두 개: 강의 원문 질문(pdf 질문만) / 1회차 숙제(6장)
const VIEWS={
  pdf:{title:"강의 원문 질문만 모아 보기",lead:"1회차 PDF의 연습 · 핵심 질문 · 실습만 모았습니다. 주제마다 강의 정리를 같이 두었으니 읽고 바로 답을 적어 보세요.",
    data:FULL.filter(c=>!c.hw).map(c=>({...c,topics:c.topics.map(t=>({...t,q:t.q.filter(q=>q.kind==="pdf")})).filter(t=>t.q.length)})).filter(c=>c.topics.length)},
  hw:{title:"1회차 숙제",lead:"과제 1 · 대표작 코어 메카닉 · 루프 도식, 과제 2 · 최근 플레이한 게임 분석 노트(A4 반 장). 다 쓰고 제출 전 점검까지 확인하세요.",
    data:FULL.filter(c=>c.hw)}
};
let view="pdf",DATA=[],ALL=[];
const answers={};

const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function sumHTML(s){
  if(s.t) return `<div class="tbl"><table><thead><tr>${s.t.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(d=>`<td>${esc(d)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(s.k) return `<p class="key">${esc(s.k)}</p>`;
  return `<p>${esc(s.p)}</p>`;
}
function render(){
  document.getElementById("main").innerHTML=DATA.map(c=>`
    <section class="chapter${c.hw?" homework":""}" id="ch${c.no}">
      <div class="ch-head"><span class="ch-no">CH.${c.no}</span><h2>${esc(c.title)}</h2></div>
      ${c.topics.map(t=>`
      <article class="topic" data-topic="${t.id}">
        <div class="t-head"><div class="t-row"><span class="t-id">${t.id}</span><h3>${esc(t.title)}</h3></div>${t.sub?`<p class="t-sub">${esc(t.sub)}</p>`:""}</div>
        <div class="summary">${t.s.map(sumHTML).join("")}</div>
        <div class="qs">${t.q.map(q=>`<div class="q" data-q="${q.id}"><label class="q-top" for="${q.id}"><span class="tag ${q.kind}">${LABEL[q.kind]}</span><span class="q-text">${esc(q.text)}</span></label>${q.hint?`<p class="q-hint">${esc(q.hint)}</p>`:""}<textarea id="${q.id}" class="${/body|loop/.test(q.id)&&q.kind==="hw"?"long":""}" rows="2" placeholder="생각나는 대로 적어 두고 나중에 다듬어도 됩니다"></textarea></div>`).join("")}</div>
      </article>`).join("")}
    </section>`).join("");
}
function refresh(){
  let done=0;
  ALL.forEach(q=>{const v=(answers[q.id]||"").trim();document.querySelector(`[data-q="${q.id}"]`).classList.toggle("done",!!v);if(v)done++;});
  document.querySelectorAll(".topic").forEach(t=>{const qs=[...t.querySelectorAll(".q")];t.classList.toggle("all-done",qs.length>0&&qs.every(q=>q.classList.contains("done"))||qs.length===0)});
  document.getElementById("count").textContent=`${done} / ${ALL.length}`;
  document.getElementById("fill").style.width=(done/ALL.length*100)+"%";
  document.getElementById("toc").innerHTML=DATA.map(c=>{const qs=c.topics.flatMap(t=>t.q);const d=qs.filter(q=>(answers[q.id]||"").trim()).length;
    return `<a href="#ch${c.no}" class="${d===qs.length?"full":""}${c.hw?" hw":""}"><span>${c.no}. ${esc(c.title)}</span><span class="n">${d}/${qs.length}</span></a>`}).join("");
}
function setView(v){
  view=VIEWS[v]?v:"pdf";
  const V=VIEWS[view];DATA=V.data;ALL=DATA.flatMap(c=>c.topics.flatMap(t=>t.q));
  document.getElementById("h1").textContent=V.title;
  document.getElementById("lead").textContent=V.lead;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  render();
  ALL.forEach(q=>{document.getElementById(q.id).value=answers[q.id]||""});
  refresh();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.view===view)return;
  history.replaceState(null,"","#"+b.dataset.view);setView(b.dataset.view);window.scrollTo(0,0);
}));
setView(location.hash.slice(1));

const saveEl=document.getElementById("save");
// 공유 저장: Supabase의 study_answers(page, qid, body)가 기준(링크 가진 사람 모두 같이 고침).
// config.js가 비었거나 서버가 안 되면 이 브라우저(localStorage)에만 저장
const CFG=window.STUDY_CONFIG||{};
const PAGE="round1";
let online=false;const timers={},chain={},pending=new Set();
const LS="study-round1-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(answers))}catch(e){}}
Object.assign(answers,lsLoad());
setView(view);

async function api(path,{method="GET",body,prefer}={}){
  const headers={apikey:CFG.supabaseAnonKey,"Content-Type":"application/json"};
  // 예전 anon 키(JWT)는 Authorization 헤더도 필요, 새 publishable 키는 apikey만
  if(!CFG.supabaseAnonKey.startsWith("sb_"))headers.Authorization="Bearer "+CFG.supabaseAnonKey;
  if(prefer)headers.Prefer=prefer;
  const res=await fetch(`${CFG.supabaseUrl.replace(/\/$/,"")}/rest/v1/${path}`,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!res.ok)throw new Error(`${res.status} ${await res.text()}`);
  return res.status===204?null:res.json().catch(()=>null);
}
const fetchAll=()=>api(`study_answers?page=eq.${PAGE}&select=qid,body`);
// 같은 질문은 한 번에 하나씩만 저장
function push(id){
  chain[id]=(chain[id]||Promise.resolve()).then(async()=>{
    try{await api("study_answers?on_conflict=page,qid",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:[{page:PAGE,qid:id,body:answers[id]||""}]});return true}
    catch(err){saveEl.textContent="저장 실패 · 이 브라우저에는 남아 있음";return false}
  });
  return chain[id];
}
// 다른 사람이 고친 답 반영. 내가 지금 쓰는 칸은 건드리지 않음
function apply(id,t){
  if(typeof t!=="string"||answers[id]===t)return;
  const el=document.getElementById(id);
  if(pending.has(id)||(el&&document.activeElement===el))return;
  answers[id]=t;if(el)el.value=t;
}

document.getElementById("main").addEventListener("input",e=>{
  const ta=e.target;if(ta.tagName!=="TEXTAREA")return;
  answers[ta.id]=ta.value;lsSave();refresh();
  if(!online)return;
  const id=ta.id;
  saveEl.textContent="저장 중…";pending.add(id);
  clearTimeout(timers[id]);
  const h=setTimeout(async()=>{
    const ok=await push(id);
    if(timers[id]!==h)return; // 저장하는 사이 또 입력함
    pending.delete(id);
    if(ok)saveEl.textContent="저장됨 · 같이 보는 사람에게 반영";
  },900);
  timers[id]=h;
});

(async()=>{
  if(!(CFG.supabaseUrl&&CFG.supabaseAnonKey)){saveEl.textContent="이 브라우저에만 저장";return}
  try{
    const rows=await fetchAll();
    const seen=new Set();
    rows.forEach(r=>{seen.add(r.qid);apply(r.qid,r.body)});
    online=true;lsSave();refresh();
    // 이 브라우저에만 있던 답은 공유 저장소로 올림
    const shown=Object.values(VIEWS).flatMap(V=>V.data.flatMap(c=>c.topics.flatMap(t=>t.q)));
    for(const q of shown){if(!seen.has(q.id)&&(answers[q.id]||"").trim())await push(q.id)}
  }catch(e){saveEl.textContent="이 브라우저에만 저장 · 서버 연결 안 됨";return}
  saveEl.textContent="같이 쓰기 켜짐";
  // 다른 사람이 고친 내용은 몇 초마다 확인 (이 탭을 보고 있을 때만)
  setInterval(async()=>{
    if(document.visibilityState!=="visible")return;
    try{(await fetchAll()).forEach(r=>apply(r.qid,r.body));lsSave();refresh()}catch(e){}
  },4000);
})();

const fb=document.getElementById("filter");
fb.addEventListener("click",()=>{const on=fb.getAttribute("aria-pressed")!=="true";fb.setAttribute("aria-pressed",on);document.body.classList.toggle("only-empty",on)});

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function markdown(){
  let md=`# ${VIEWS[view].title}\n\n`;
  DATA.forEach(c=>{md+=`## ${c.no}. ${c.title}\n\n`;c.topics.forEach(t=>{md+=`### ${t.id} ${t.title}\n\n`+(t.sub?t.sub+"\n\n":"");
    t.s.forEach(s=>{if(s.t){md+="| "+s.t.join(" | ")+" |\n|"+s.t.map(()=>"---").join("|")+"|\n"+s.rows.map(r=>"| "+r.join(" | ")+" |").join("\n")+"\n\n"}else md+=(s.k?"> ":"")+(s.k||s.p)+"\n\n"});
    t.q.forEach(q=>{const a=(answers[q.id]||"").trim();md+=`- [${a?"x":" "}] **${LABEL[q.kind]}** ${q.text}\n`+(a?"  "+a.replace(/\n/g,"\n  ")+"\n":"")});md+="\n";})});
  return md;
}
function notionHTML(){
  let h=`<h1>${esc(VIEWS[view].title)}</h1>`;
  DATA.forEach(c=>{h+=`<h1>${c.no}. ${esc(c.title)}</h1>`;c.topics.forEach(t=>{h+=`<h2>${esc(t.id)} ${esc(t.title)}</h2>`+(t.sub?`<p>${esc(t.sub)}</p>`:"");
    t.s.forEach(s=>{
      if(s.t) h+=`<table><thead><tr>${s.t.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(d=>`<td>${esc(d)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      else if(s.k) h+=`<blockquote>${esc(s.k)}</blockquote>`;
      else h+=`<p>${esc(s.p)}</p>`;
    });
    if(t.q.length) h+="<h3>질문</h3>";
    t.q.forEach(q=>{const a=(answers[q.id]||"").trim();
      h+=`<p><strong>[${LABEL[q.kind]}] ${esc(q.text)}</strong></p>`;
      h+=a?`<blockquote>${a.split("\n").map(esc).join("<br>")}</blockquote>`:`<blockquote>(아직 안 씀)</blockquote>`;
    });
    h+="<hr>";
  })});
  return h;
}
document.getElementById("copy").addEventListener("click",async()=>{
  const html=notionHTML(),md=markdown();
  const ok="복사했습니다. 노션 새 페이지에 붙여 넣으세요";
  const onCopy=e=>{e.clipboardData.setData("text/html",html);e.clipboardData.setData("text/plain",md);e.preventDefault()};
  document.addEventListener("copy",onCopy);
  let done=false;try{done=document.execCommand("copy")}catch(e){}
  document.removeEventListener("copy",onCopy);
  if(done){toast(ok);return}
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([md],{type:"text/plain"})})]);toast(ok)}
  catch(e){toast("복사가 막혔습니다. 브라우저에서 열어 다시 시도하세요")}
});
</script>
